<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Música</title>
  <link rel="stylesheet" href="../../style.css">
</head>

<body>
  <div id="symbols"></div>
  <div class="container">
    <main>
      <section class="music-container">

        <div>
          <div class="music-container_cover" id="cover">
          <img alt="portada" id="portada">
        </div>

        <div class="music-player">
          <h2 class="music-player_title" id="title">Nombre desconocido</h2>
          <p class="music-player_artist" id="artist">Artista desconocido</p>
          <audio id="audio-player" value="0" min="0" step="0.1"></audio>
          <div class="progress-container">
            <input type="range" id="progress">
            <div class="progress-container_info">
              <span id="time">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>
          <div class="controller">
            <button class="controller_prev" id="prev">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
                class="bi bi-arrow-left-short" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                  d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5" />
              </svg>
            </button>
            <button class="controller_play" id="play">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" class="bi bi-play-fill"
                viewBox="0 0 16 16">
                <path
                  d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393" />
              </svg>
            </button>
            <button class="controller_next" id="next">
              <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
                class="bi bi-arrow-right-short" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                  d="M4 8a.5.5 0 0 1 .5-.5h5.793L8.146 5.354a.5.5 0 1 1 .708-.708l3 3a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708-.708L10.293 8.5H4.5A.5.5 0 0 1 4 8" />
              </svg>
            </button>
          </div>
        </div>
        </div>

      </section>
    </main>
  </div>
  <script src="../index.js"></script>
</body>

</html>
