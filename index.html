<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top 10 songs</title>
  <style>

    @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,900;1,900&display=swap');
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .particles {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255,255,255,.85);
      box-shadow: 0 0 12px white;
      animation: brillar 3s ease-in-out infinite;
    }

    body {
     min-height: 100vh;
     position: relative;
     background-color: #000;
     overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(
        rgba(0, 0, 0, 0.8), 
        rgba(30, 0, 0, 0.8)), 
          url('./src/assets/images/wallpaper.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: grayscale(90%);
      z-index: -1;
    } 

    .container {
      min-width: 300px;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    section {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    h1 {
      font-family: "Hanken Grotesk", sans-serif;
      font-size: 4rem;
      font-weight: 900;
      color: #ff003c;
      text-shadow: 4px 4px 1px #91001e;
      letter-spacing: -4px
    }

    p{
      margin-top: 8px;
      background-color: rgba(0, 0, 0, .3);
      color: #d0a9a7;
      padding: 15px 20px;
      border-color: red;
      border-left: 2px solid #00dbe9;
      border-right: 2px solid #00dbe9;
    }

    img {
      margin-top: 10px;
      width: 170px;
    }

    .btn {
      margin-top: 50px;
      padding: 7px 25px;
      background-color: #ff003c;
      color: #0e0e0f;
      font-size: 1.3rem;
      font-family: "Hanken Grotesk", sans-serif;
      border: none;
      box-shadow: 0px -1px 6px 1px #48121f;
      cursor: pointer;
      outline: none;
      transform: skewX(-20deg);
      transition: background-color .4s, transform .4s, color .4s ease-in;
      
    }
    .btn span {
      display: inline-block;
      transform: skewX(20deg)
    }
    .btn:active {
      color: #ff003c;
      background-color: #0e0e0f;
      transform: skewX(-20deg) scale(1.05)
    }
    /* button {
      position: absolute;
      margin-top: 30px;
      font-size: 1.2rem;
      padding: 10px;
      background-color: crimson;
      color: white;
      border: none;
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      transition: all .2s ease;
    } */

    @keyframes brillar { 
      0%,
      100% { opacity: .2; transform: scale(.7); } 
      50% { opacity: 1; transform: scale(1.3); } 
    }

    /* spinner */
    .loader {
      margin-top:-50px;
      width: 50px;
      aspect-ratio: 1;
      display: grid;
      border: 4px solid #0000;
      border-radius: 50%;
      border-color: #ccc #0000;
      animation: l16 1s infinite linear;
    }
    .loader::before,
    .loader::after {    
      content: "";
      grid-area: 1/1;
      margin: 2px;
      border: inherit;
      border-radius: 50%;
    }
    .loader::before {
      border-color: #f03355 #0000;
      animation: inherit; 
      animation-duration: .5s;
      animation-direction: reverse;
    }
    .loader::after {
      margin: 8px;
    }
    @keyframes l16 { 
      100%{transform: rotate(1turn)}
    }

    @media (hover: hover) {
      button:hover {
        color: #ff003c;
        background-color: #0e0e0f;
        transform: skewX(-20deg) scale(1.05)
      }
    }

  </style>
</head>
<body>
  <div id="particles"></div>
  <main class="container">
    <section>
      <h1 class="title">TOP-10</h1>
      <p>Estas son mis 10 Músicas favoritas</p>
      <button class="btn" id="btn"><span>ENTRAR</span></button>
      <!-- <button id="btn">Ingresar</button> -->
      <div class="spinner"></div>
    </section>
  </main>

  <script>
      const btn = document.getElementById('btn')
      const particlesContainer = document.getElementById('particles')

      const particleCount = 15;
      const getRandomNumber = (min, max) => min + Math.random() * (max - min);

      function createParticles(count) {
        if (!particlesContainer) return;

        for (let i = 0; i < count; i++) {
          const particle = document.createElement('span');
          particle.className = 'particles';

          particle.style.left = `${getRandomNumber(0, 100)}%`;
          particle.style.top = `${getRandomNumber(0, 100)}%`;
          particle.style.animationDelay = `${getRandomNumber(0, 3)}s`;
          particle.style.animationDuration = `${getRandomNumber(2, 5)}s`;

          particlesContainer.appendChild(particle);
        }
      }


      createParticles(particleCount)
      btn.addEventListener('click', () => {

        const spinner = document.querySelector('.spinner')
        btn.style.opacity = 0
        spinner.classList.add('loader')

        setTimeout(() => {
          location.pathname = './src/pages/music-player.html'
          btn.style.opacity = 1
          spinner.classList.remove('loader')
        }, 3000)

        
        
      })
