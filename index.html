<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <main>
      <div class="music-container">

        <div class="music-container_cover" id="cover">
          <img src="./portada.jpg" alt="portada">
        </div>

        <div class="music-player">
          <h2 class="music-player_title" id="title">Nombre desconocido</h2>
          <p class="music-player_artist" id="artist">Artista desconocido</p>
          <audio id="audio-player" value="0" min="0" step="0.1"></audio>
          <div class="progress-container">
            <input type="range" id="progress"> 
            <div class="progress-container_info">
              <span id="time">0:00</span>
              <span id="duration">0:00</span>
            </div>
          </div>
          <div class="controller">
            <!-- <button class="controller_prev" id="prev">⏮</button> -->
            <button class="controller_play" id="play">▶</button>
            <!-- <button class="controller_next" id="next">⏭</button> -->
          </div> 
        </div>

      </div>
    </main>
  </div>
  <script src="index.js"></script>
</body>
</html>
